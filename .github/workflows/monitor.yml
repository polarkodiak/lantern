name: Page watch

on:
  schedule:
    - cron: "3-59/10 * * * *"   # every 10 minutes
    - cron: "40 3 1 * *"        # monthly keepalive, see the keepalive job
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-watch
  cancel-in-progress: false

jobs:
  check:
    if: github.event.schedule != '40 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't swap in
      # code that reads the secrets below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # State lives in the Actions cache instead of a commit, so nothing about
      # it appears in the repository history. Each run saves under a new key;
      # the restore picks the most recent one.
      - name: Restore state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .monitor-state.json
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: monitor-state-

      - name: Check page
        env:
          WATCH_URL: ${{ secrets.WATCH_URL }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          SECTION_START: ${{ secrets.SECTION_START }}
          SECTION_END: ${{ secrets.SECTION_END }}
          ALERT_TITLE: ${{ secrets.ALERT_TITLE }}
          NOTIFY_DETAILS: ${{ secrets.NOTIFY_DETAILS }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python monitor.py

      - name: Save state
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .monitor-state.json
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}

  # GitHub turns off scheduled workflows in a public repository after 60 days
  # without a commit. A dated commit once a month prevents that; it holds no
  # secrets and its timing is fixed, so it reveals nothing. Harmless in a
  # private repository, where the 60-day rule doesn't apply.
  keepalive:
    if: github.event.schedule == '40 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Commit keepalive
        run: |
          date -u +%Y-%m > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet && exit 0
          git commit -m "Keep scheduled workflow active"
          git push
