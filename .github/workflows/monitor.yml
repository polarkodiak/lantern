name: Page watch

on:
  schedule:
    - cron: "3-59/10 * * * *"   # every 10 minutes
    - cron: "40 3 1 * *"        # monthly keepalive, see the keepalive job
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-watch
  cancel-in-progress: false

jobs:
  # Loads the page in Chrome. This job gets only the page address and the
  # section headings, never the keywords, state key or notification
  # credentials, so a malicious page, a browser exploit or a tampered package
  # can't reach them. It hands the watched section to the check job, which
  # runs on a separate machine, through the Actions cache.
  fetch:
    if: github.event.schedule != '40 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't swap in
      # different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        # Every package, including Playwright's own dependencies, must match a
        # pinned SHA-256 checksum, and only prebuilt wheels are accepted.
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt

      - name: Load page
        env:
          WATCH_URL: ${{ secrets.WATCH_URL }}
          SECTION_START: ${{ secrets.SECTION_START }}
          SECTION_END: ${{ secrets.SECTION_END }}
        run: python monitor.py fetch

      - name: Hand over page
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .page-section.bin
          key: page-${{ github.run_id }}-${{ github.run_attempt }}

  # Matches the keywords, keeps state and sends alerts and the heartbeat.
  # Uses only the Python standard library and never runs a browser. It runs
  # even when the fetch job fails, so the heartbeat can report the failure.
  check:
    needs: fetch
    if: always() && github.event.schedule != '40 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Receive page
        if: success() && needs.fetch.result == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .page-section.bin
          key: page-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: page-${{ github.run_id }}-
          fail-on-cache-miss: true

      # State lives in the Actions cache instead of a commit, so nothing about
      # it appears in the repository history. Each run saves under a new key;
      # the restore picks the most recent one.
      - name: Restore state
        if: success() && needs.fetch.result == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .monitor-state.json
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: monitor-state-

      - name: Check page
        if: success() && needs.fetch.result == 'success'
        env:
          WATCH_URL: ${{ secrets.WATCH_URL }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          ALERT_TITLE: ${{ secrets.ALERT_TITLE }}
          NOTIFY_DETAILS: ${{ secrets.NOTIFY_DETAILS }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python monitor.py check

      - name: Save state
        if: success() && needs.fetch.result == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .monitor-state.json
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Optional dead-man's switch: pings HEARTBEAT_URL after every run (with
      # /fail appended when either job failed), so an uptime service can alert
      # you if the checks stop running. A network error on the ping never
      # fails the check, but a non-https HEARTBEAT_URL does.
      - name: Report heartbeat
        if: always()
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          OUTCOME: ${{ needs.fetch.result == 'success' && job.status || 'failure' }}
        run: |
          [ -n "$HEARTBEAT_URL" ] || exit 0
          case "$HEARTBEAT_URL" in
            https://*) ;;
            *) echo "HEARTBEAT_URL must be an https:// address" >&2; exit 1 ;;
          esac
          if [ "$OUTCOME" != success ]; then
            # Add /fail to the path, keeping any ?query after it.
            base="${HEARTBEAT_URL%%\?*}"
            HEARTBEAT_URL="${base%/}/fail${HEARTBEAT_URL#"$base"}"
          fi
          curl -fs --proto =https -m 10 --retry 3 -o /dev/null "$HEARTBEAT_URL" || true

  # Deletes the page hand-over from the Actions cache once the check job has
  # used it, along with any older ones, so the page text doesn't stay in the
  # cache. It gets no secrets and runs no outside code, only the GitHub CLI
  # that comes with the runner. A deletion that fails is caught up by the
  # next run, which clears every leftover hand-over.
  cleanup:
    needs: [fetch, check]
    if: always() && github.event.schedule != '40 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete page hand-overs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deleted=0
          while read -r key; do
            gh cache delete "$key" > /dev/null 2>&1 && deleted=$((deleted + 1))
          done < <(gh cache list --key page- --limit 1000 --json key --jq '.[].key' 2> /dev/null || true)
          echo "Deleted $deleted page hand-over(s)."

  # GitHub turns off scheduled workflows in a public repository after 60 days
  # without a commit. A dated commit once a month prevents that; it holds no
  # secrets and its timing is fixed, so it reveals nothing. Harmless in a
  # private repository, where the 60-day rule doesn't apply.
  keepalive:
    if: github.event.schedule == '40 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Commit keepalive
        run: |
          date -u +%Y-%m > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet && exit 0
          git commit -m "Keep scheduled workflow active"
          git push
